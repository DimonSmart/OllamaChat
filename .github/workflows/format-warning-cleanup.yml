name: One-time Roslyn formatting

on:
  push:
    branches:
      - format/compiler-warning-cleanup

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OllamaChat.sln
      - name: Format
        run: dotnet format whitespace OllamaChat.sln --no-restore --verbosity normal
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'Apply Roslyn formatting across solution'
            git push
          fi
